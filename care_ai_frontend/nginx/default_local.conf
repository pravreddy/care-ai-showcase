# ============================================================
# Care AI Frontend - Nginx Configuration
# 
# Two roles:
#   1. Serve React SPA static files
#   2. Reverse proxy /api to FastAPI backend
#
# HTTP mode ships with the image. For HTTPS, mount an SSL
# config via docker-compose volume when certs are ready.
# ============================================================

upstream backend {
    server careai-api-local:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Max upload (voice/video notes — processed in memory, never stored)
    client_max_body_size 500M;

    # --- Proxy /api to FastAPI backend ---
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- Backend health passthrough ---
    location /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
    }

    location /ping {
        proxy_pass http://backend/ping;
        proxy_set_header Host $host;
    }

    # --- React SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets (Vite adds content hashes to filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Never cache index.html (so deploys take effect immediately)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
