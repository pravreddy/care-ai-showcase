events { worker_connections 1024; }
http {
    client_max_body_size 500M;
    include /etc/nginx/mime.types;

    resolver 127.0.0.11 valid=30s;

    # DocSign server block (only loaded when file exists — safe if DocSign not deployed)
    include /etc/nginx/conf.d/docsign*.conf;

    # Static marketing sites (guhya.co.in, etc.) — managed by add-site.sh
    include /etc/nginx/conf.d/sites/*.conf;

    # --- Care AI: HTTP → HTTPS (with ACME exception for Let's Encrypt) ---
    server {
        listen 80;
        server_name careaisoftware.co.uk www.careaisoftware.co.uk;

        # Let's Encrypt HTTP-01 challenge — MUST return 200 over HTTP, no redirect
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
        }

        # Everything else redirects to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- Care AI: HTTPS ---
    server {
        listen 443 ssl;
        http2 on;
        server_name careaisoftware.co.uk www.careaisoftware.co.uk;

        # Blue/green switch — written by deploy script
        include /etc/nginx/active_env.conf;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:CareAISSL:10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deep liveness of the LIVE blue/green API (Uptime Kuma hits this).
        # /healthz returns 503 if Postgres is unreachable, so it catches
        # "container up but DB down". Exact match -> no clash with the SPA.
        # $active_backend is swapped by the deploy, so this is colour-agnostic.
        location = /healthz {
            proxy_pass http://$active_backend;
            access_log off;
        }

        location /api {
            proxy_pass http://$active_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://$active_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
