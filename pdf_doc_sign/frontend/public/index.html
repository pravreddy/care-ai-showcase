<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Primary SEO -->
  <title>SignSimple – Free PDF Document Signing for UK Businesses</title>

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Avyangah Technologies Limited",
    "url": "https://signsimple.co.uk",
    "logo": "https://signsimple.co.uk/logo.png",
    "description": "UK-based software company providing electronic signature and document management solutions.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "GB"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "support@signsimple.co.uk",
      "contactType": "customer support"
    },
    "sameAs": []
  }
  </script>

  <!-- Structured Data: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "SignSimple",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "offers": [
      {
        "@type": "Offer",
        "name": "Free Plan",
        "price": "0",
        "priceCurrency": "GBP",
        "description": "10 free documents every month for new businesses"
      },
      {
        "@type": "Offer",
        "name": "Starter Plan",
        "price": "2.50",
        "priceCurrency": "GBP",
        "description": "100 documents per month"
      },
      {
        "@type": "Offer",
        "name": "Professional Plan",
        "price": "10.00",
        "priceCurrency": "GBP",
        "description": "1,000 documents per month"
      }
    ],
    "publisher": {
      "@type": "Organization",
      "name": "Avyangah Technologies Limited",
      "url": "https://avyangah.co.uk"
    }
  }
  </script>

  <!-- Structured Data: FAQPage (boosts SEO) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Is SignSimple really free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes! Every account gets 10 free documents to sign every month. No credit card required. Perfect for freelancers and new businesses."
        }
      },
      {
        "@type": "Question",
        "name": "How much does it cost for more documents?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Our Starter plan is just £2.50 per month for 100 documents. Need more? Add extra documents for just £1 per 100. Our Professional plan gives you 1,000 documents for £10 per month."
        }
      },
      {
        "@type": "Question",
        "name": "Are e-signatures legally binding in the UK?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Under the Electronic Communications Act 2000 and eIDAS regulations, electronic signatures are legally valid in the UK for most documents."
        }
      }
    ]
  }
  </script>

  <link rel="icon" href="/favicon.ico" />
