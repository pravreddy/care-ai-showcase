# =============================================================
# SignSimple — Nginx Server Block
# =============================================================

server {
    listen 80;
    server_name signsimple.co.uk www.signsimple.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name signsimple.co.uk www.signsimple.co.uk;

    # Blue/green switch variables
    include /etc/nginx/active_docsign.conf;

    ssl_certificate     /etc/nginx/ssl/docsign-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/docsign-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:DocsignSSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 500M;

    # ===========================================
    # 1. Django Backend Statics (Admin/DRF)
    # ===========================================
    location /static/admin/ {
        proxy_pass http://$ds_backend;
        proxy_set_header Host $host;
    }

    location /static/rest_framework/ {
        proxy_pass http://$ds_backend;
        proxy_set_header Host $host;
    }

    # ===========================================
    # 2. React Frontend Statics
    # ===========================================
    location /static/ {
        proxy_pass http://$ds_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- THE MIME & HTTPS FIXES ---
        proxy_pass_header Content-Type;   # Force Nginx to pass the 'application/javascript' header
        proxy_redirect http:// https://;  # Fix the "Mixed Content" 301 error
    }

    # ===========================================
    # 3. API & Django Logic
    # ===========================================
    location /api/ {
        proxy_pass http://$ds_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://$ds_backend;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # The Redirect Loop Killers
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Ensure Nginx doesn't rewrite the 'Location' header from Django incorrectly
        proxy_redirect http:// https://;
    }

    location /accounts/ {
    	proxy_pass http://$ds_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://$ds_backend;
        proxy_set_header Host $host;
    }

    # ===========================================
    # 4. Frontend (React SPA) Catch-all
    # ===========================================
    location / {
        proxy_pass http://$ds_frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- THE HTTPS FIX ---
        proxy_redirect http:// https://;
    }


    # Security: Deny hidden files except .well-known
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
