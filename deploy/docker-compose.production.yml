# Location: /home/deploy/careai/docker-compose.yml
# Production version - Split storage strategy:
#   - NVMe (/mnt/nvme_data): SignSimple (fast PDF processing)
#   - HDD (~/careai/hdd_storage): Ollama models, Care AI logs (big & slow is fine)

x-app-base: &app_base
  restart: unless-stopped
  env_file: .env
  networks: [careai-net]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    container_name: careai-postgres
    volumes: ["/mnt/nvme_data/postgres_data:/var/lib/postgresql/data"]
    environment:
      POSTGRES_DB: careai
      POSTGRES_USER: careai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [careai-net]

  redis:
    image: redis:7-alpine
    container_name: careai-redis
    volumes: ["/mnt/nvme_data/redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [careai-net]

  # ===========================================
  # Ollama - Moved to HDD (models are ~5GB each, read-once into RAM)
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: careai-ollama
    environment: ["OLLAMA_HOST=0.0.0.0"]
    volumes:
      - ./hdd_storage/ollama:/root/.ollama
    networks: [careai-net]

  # ===========================================
  # Care AI API - Logs moved to HDD
  # ===========================================
  api-blue:
    <<: *app_base
    container_name: careai-api-blue
    image: ghcr.io/${GITHUB_USER}/careai-api:latest
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama: { condition: service_started }
    volumes:
      - ./hdd_storage/careai_logs:/app/logs
      - ./hdd_storage/careai/blue:/app/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-green:
    <<: *app_base
    container_name: careai-api-green
    image: ghcr.io/${GITHUB_USER}/careai-api:latest
    profiles: [green]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama: { condition: service_started }
    volumes:
      - ./hdd_storage/careai_logs:/app/logs
      - ./hdd_storage/careai/green:/app/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend-blue:
    image: ghcr.io/${GITHUB_USER}/careai-frontend:latest
    container_name: careai-frontend-blue
    restart: unless-stopped
    networks: [careai-net]

  frontend-green:
    image: ghcr.io/${GITHUB_USER}/careai-frontend:latest
    container_name: careai-frontend-green
    restart: unless-stopped
    profiles: [green]
    networks: [careai-net]

  nginx:
    image: nginx:alpine
    container_name: careai-nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: >
      sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-docsign.conf:/etc/nginx/conf.d/docsign.conf:ro
      - ./active_env.conf:/etc/nginx/active_env.conf:ro
      - ./active_docsign.conf:/etc/nginx/active_docsign.conf:ro
      - /mnt/nvme_data/ssl:/etc/nginx/ssl:ro
    networks: [careai-net]

networks:
  careai-net: { driver: bridge }
