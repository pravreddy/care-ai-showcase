# =============================================================
# Avyangah Technologies — Base Infrastructure
# =============================================================
# Shared services used by ALL apps. Run with overlays:
#
#   ALL ON ONE SERVER (current):
#     docker compose -f docker-compose.yml \
#       -f docker-compose.careai.yml \
#       -f docker-compose.docsign.yml \
#       up -d
#
#   SPLIT LATER (when traffic grows):
#     Server 1 (apps):   docker compose -f docker-compose.yml -f docker-compose.careai.yml -f docker-compose.docsign.yml up -d
#     Server 2 (postal):  docker compose -f docker-compose.postal.yml up -d
#     Server 3 (India):   docker compose -f docker-compose.yml -f docker-compose.guhya.yml up -d
#
#   Each service uses ENV VARS for connections, so you can point
#   any service to a remote server by changing the .env file.
# =============================================================

x-common: &common
  restart: unless-stopped
  networks: [avyangah-net]

services:

  # ===========================================
  # PostgreSQL — shared by all apps
  # ===========================================
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: avyangah-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-avyangah}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-avyangah}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avyangah}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis — shared cache, rate limiting, celery broker
  # ===========================================
  redis:
    <<: *common
    image: redis:7-alpine
    container_name: avyangah-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Caddy — reverse proxy + auto HTTPS (replaces Nginx)
  # ===========================================
  caddy:
    <<: *common
    image: caddy:2-alpine
    container_name: avyangah-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  avyangah-net:
    driver: bridge
